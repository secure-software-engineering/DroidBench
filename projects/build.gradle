tasks.register('assemble') {
    group = 'build'
    description = 'Assembles all apps'
    
    dependsOn gradle.includedBuild('Lifecycle').task(':assemble')
}
tasks.register('clean') {
    group = 'build'
    description = 'Removes all build artifacts'
    
    dependsOn gradle.includedBuild('Lifecycle').task(':clean')
}
